set-option -g prefix C-p

# Reload configuration shortcut
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded."

# Mouse mode
set -g mouse on

# Easier window split
bind-key v split-window -h
bind-key h split-window -v

# switch windows
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Reorder windows ctrl+shift+arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# -----------------------------------------------------------------------------
# Theme / Styling
# -----------------------------------------------------------------------------

# Status bar layout
set-option -g status on
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style "bg=default,fg=#d0d0d0"

# Left status: Session name block with active border color
set-option -g status-left-length 50
set-option -g status-left "#[bg=#ababab,fg=#121212,bold] #S #[bg=default,fg=default] "

# Right status: Completely empty as requested
set-option -g status-right-length 0
set-option -g status-right ""

# Window status list
set-window-option -g window-status-separator " "

# Inactive window format
set-window-option -g window-status-style "bg=#181818,fg=#707070"
set-window-option -g window-status-format "#[bg=#181818,fg=#707070] #I: #W "

# Active window format
set-window-option -g window-status-current-style "bg=#2c2c2c,fg=#f5f5f5,bold"
set-window-option -g window-status-current-format "#[bg=#2c2c2c,fg=#f5f5f5,bold] #I: #W "

# Pane borders
set-option -g pane-border-style "fg=#242424"
set-option -g pane-active-border-style "fg=#ababab"

# Popup / floax / jot border colors
set -g @floax-border-color "#ababab"
set -g @jot-border-color "#ababab"

# Messages & command prompt
set-option -g message-style "bg=#181818,fg=#f5f5f5"
set-option -g message-command-style "bg=#181818,fg=#f5f5f5"
